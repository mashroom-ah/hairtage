<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Hairitage — Настройки</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/pages/settings.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
        rel="stylesheet">
</head>
</head>

<body>
    <header class="header">
        <nav class="nav">
            <button class="nav-link" onclick="goToHome()">Главная</button>
            <button class="nav-link active" onclick="goToAccount()">Аккаунт</button>
            <button class="nav-link" onclick="goToResults()">Подборка</button>
        </nav>

        <div class="brand">
            <span>Hairtage</span>
            <img src="assets/icons/logo.svg" alt="Hairtage logo">
        </div>
    </header>

    <div class="decor-left">
        <img src="assets/icons/comb.svg" alt="">
    </div>

    <div class="decor-right">
        <img src="assets/icons/brush.svg" alt="">
    </div>

    <main class="settings-page">
        <form id="settingsForm" class="settings-form">
            <label>
                Имя
                <input type="text" id="nameInput" />
            </label>

            <label>
                Email
                <input type="email" id="emailInput" />
            </label>

            <label>
                Пароль*
                <input type="password" id="passwordInput" minlength="8" />
            </label>

            <p class="hint">*Минимум 8 символов</p>

            <button type="submit" class="btn-primary">Сохранить</button>
            <button type="button" id="cancelBtn" class="btn-secondary">Отмена</button>

        </form>

    </main>

    <script src="js/nav-logic.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
