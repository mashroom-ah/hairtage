<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Регистрация — Hairitage</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/pages/register.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">

        <button class="burger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav">
            <button class="nav-link" onclick="goToHome()">Главная</button>
            <button class="nav-link active" onclick="goToAccount()">Аккаунт</button>
            <button class="nav-link" onclick="goToResults()">Подборка</button>
        </nav>

        <div class="brand">
            <span>Hairtage</span>
            <img src="assets/icons/logo.svg" alt="Hairtage logo">
        </div>
    </header>

    <div class="decor-left">
        <img src="assets/icons/comb.svg" alt="">
    </div>

    <div class="decor-right">
        <img src="assets/icons/brush.svg" alt="">
    </div>

    <main class="register">
        <!-- Форма -->
        <div class="register-card">
            <div class="reg-banner">
                <p class="register-title">Регистрация в Hairtage</p>
            </div>

            <form id="registerForm" class="register-form">

                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@email.com" required>
                </div>

                <div class="form-group">
                    <label>Пароль*</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <p>*Минимум 8 символов</p>
                </div>

                <button type="submit" class="btn-primary">
                    Регистрация
                </button>

                <p class="register-footer">
                    Есть аккаунт?
                    <a href="login.html">Вход</a>
                </p>

            </form>

        </div>

    </main>

    <script src="js/nav-logic.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
