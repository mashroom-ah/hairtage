<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход — Hairitage</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/pages/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="header">
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="account.html" class="active">Аккаунт</a>
            <a href="results.html">Подборка</a>
        </nav>

        <div class="brand">
            <span>Hairtage</span>
            <img src="assets/icons/logo.svg" alt="Hairtage logo">
        </div>
    </header>

    <div class="decor-left">
        <img src="assets/icons/comb.svg" alt="">
    </div>

    <div class="decor-right">
        <img src="assets/icons/brush.svg" alt="">
    </div>

    <main class="login">
        <!-- Форма -->
        <div class="login-card">
            <div class="log-banner">
                <p class="login-title">Добро пожаловать в Hairtage</p>
            </div>
            
            <form id="loginForm" class="login-form">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@email.com" required>
                </div>

                <div class="form-group">
                    <label>Пароль*</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <p>*Минимум 8 символов</p>
                </div>

                <button type="submit" class="btn-primary">
                    Войти
                </button>

                <p class="login-footer">
                    Нет аккаунта?
                    <a href="register.html">Регистрация</a>
                </p>

            </form>

        </div>

    </main>

    <script src="js/login.js"></script>
</body>

</html>
